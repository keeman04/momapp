name: Build TANU Personal v2.2.1 Hardened APK

on:
  push:
    branches: [ tanu-personal-v2.2.1-hardening ]
    paths:
      - 'android-v22/**'
      - '.github/workflows/build-v221-hardening.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android-v22/**'
      - '.github/workflows/build-v221-hardening.yml'
  workflow_dispatch:

jobs:
  hard-test-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      LLAMA_CPP_SHA: 645ca2834bc16e7eab112a91aeb282ebb913f935
      QWEN_REV: 1208e45d782fe18602c5eaf10e5758d5b0f24c03
      QWEN_SHA256: b0638f08417a2d3c8652760462eb5407c6e30173cf9608ad0820757a281eea0e
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8

    steps:
      - name: Checkout hardened TANU
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native toolchains
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "ndk;29.0.13113456" \
            "cmake;3.22.1" \
            "cmake;3.31.6"

      - name: Fetch pinned whisper.cpp
        run: |
          cd android-v22
          rm -rf app/src/main/cpp/whispercpp
          git clone --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp.git app/src/main/cpp/whispercpp

      - name: Prepare pinned llama.cpp Android library
        run: |
          cd android-v22
          rm -rf third_party/llama.cpp llama-lib
          mkdir -p third_party
          git init third_party/llama.cpp
          git -C third_party/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C third_party/llama.cpp fetch --depth 1 origin "$LLAMA_CPP_SHA"
          git -C third_party/llama.cpp checkout FETCH_HEAD
          test "$(git -C third_party/llama.cpp rev-parse HEAD)" = "$LLAMA_CPP_SHA"
          cp -a third_party/llama.cpp/examples/llama.android/lib llama-lib
          cat > llama-lib/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.library")
          }

          android {
              namespace = "com.arm.aichat"
              compileSdk = 36
              ndkVersion = "29.0.13113456"

              defaultConfig {
                  minSdk = 30
                  consumerProguardFiles("consumer-rules.pro")
                  ndk { abiFilters += listOf("arm64-v8a") }
                  externalNativeBuild {
                      cmake {
                          arguments += listOf(
                              "-DCMAKE_BUILD_TYPE=Release",
                              "-DCMAKE_MESSAGE_LOG_LEVEL=STATUS",
                              "-DBUILD_SHARED_LIBS=ON",
                              "-DLLAMA_BUILD_APP=OFF",
                              "-DLLAMA_BUILD_COMMON=ON",
                              "-DLLAMA_OPENSSL=OFF",
                              "-DGGML_NATIVE=OFF",
                              "-DGGML_BACKEND_DL=ON",
                              "-DGGML_LLAMAFILE=OFF"
                          )
                      }
                  }
                  aarMetadata { minCompileSdk = 35 }
              }

              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.31.6"
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              packaging {
                  resources.excludes += setOf("META-INF/AL2.0", "META-INF/LGPL2.1")
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.17.0")
              implementation("androidx.datastore:datastore-preferences:1.1.7")
          }
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path('llama-lib/src/main/cpp/CMakeLists.txt')
          s = p.read_text()
          old = 'set(LLAMA_SRC ${CMAKE_CURRENT_LIST_DIR}/../../../../../../)'
          new = 'set(LLAMA_SRC ${CMAKE_CURRENT_LIST_DIR}/../../../../third_party/llama.cpp)'
          if old not in s:
              raise SystemExit('Official llama Android CMake layout changed')
          p.write_text(s.replace(old, new))
          PY
          grep -q 'third_party/llama.cpp' llama-lib/src/main/cpp/CMakeLists.txt
          test -f llama-lib/src/main/java/com/arm/aichat/AiChat.kt
          test -f llama-lib/src/main/cpp/ai_chat.cpp

      - name: Bundle only required AI models
        run: |
          cd android-v22
          rm -rf app/src/main/assets/models
          mkdir -p app/src/main/assets/models
          curl -L --fail --retry 4 --retry-delay 3 \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin?download=true' \
            -o app/src/main/assets/models/ggml-tiny-q5_1.bin
          test "$(stat -c%s app/src/main/assets/models/ggml-tiny-q5_1.bin)" -gt 20000000
          curl -L --fail --retry 4 --retry-delay 5 \
            "https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/${QWEN_REV}/Qwen3-0.6B-Q4_K_M.gguf?download=true" \
            -o app/src/main/assets/models/Qwen3-0.6B-Q4_K_M.gguf
          test "$(stat -c%s app/src/main/assets/models/Qwen3-0.6B-Q4_K_M.gguf)" -gt 250000000
          echo "${QWEN_SHA256}  app/src/main/assets/models/Qwen3-0.6B-Q4_K_M.gguf" | sha256sum -c -
          test "$(find app/src/main/assets/models -maxdepth 1 -type f | wc -l)" -eq 2
          ls -lh app/src/main/assets/models/

      - name: Hardening source audit
        run: |
          cd android-v22
          grep -q 'versionName = "2.2.1"' app/build.gradle.kts
          grep -q 'versionCode = 23' app/build.gradle.kts
          grep -q 'seconds: Int = 20' app/src/main/java/com/tanu/personal/audio/ChunkAccumulator.kt
          grep -q 'overlapSeconds: Int = 1' app/src/main/java/com/tanu/personal/audio/ChunkAccumulator.kt
          grep -q 'freshBytesSinceFlush' app/src/main/java/com/tanu/personal/audio/ChunkAccumulator.kt
          grep -q 'record?.stop()' app/src/main/java/com/tanu/personal/service/RecordingService.kt
          grep -q 'thread?.join(2500)' app/src/main/java/com/tanu/personal/service/RecordingService.kt
          grep -q 'PARTIAL_WAKE_LOCK' app/src/main/java/com/tanu/personal/service/RecordingService.kt
          grep -q 'NoiseSuppressor' app/src/main/java/com/tanu/personal/service/RecordingService.kt
          grep -q 'AcousticEchoCanceler' app/src/main/java/com/tanu/personal/service/RecordingService.kt
          grep -q 'AutomaticGainControl' app/src/main/java/com/tanu/personal/service/RecordingService.kt
          grep -q 'foregroundServiceType="microphone"' app/src/main/AndroidManifest.xml
          grep -q 'FLAG_KEEP_SCREEN_ON' app/src/main/java/com/tanu/personal/MainActivity.kt
          grep -q 'class TanuAgent' app/src/main/java/com/tanu/personal/ai/TanuAgent.kt
          grep -q 'AiChat.getInferenceEngine' app/src/main/java/com/tanu/personal/ai/LocalLlmProvider.kt
          grep -q '"store", false' app/src/main/java/com/tanu/personal/ai/OpenAiMomProvider.kt
          grep -q 'cleanupChunkFiles' app/src/main/java/com/tanu/personal/worker/FinalizeMeetingWorker.kt
          ! grep -R -q 'FastServerProvider' app/src/main/java
          ! grep -R -q 'ProcessingMode.FAST' app/src/main/java
          ! grep -R -q 'serverUrl' app/src/main/java
          ! grep -R -q 'fallbackToDestructiveMigration' app/src/main/java
          ! grep -R -q 'class SecureTokenStore' app/src/main/java

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run unit and long-meeting stress tests
        run: |
          cd android-v22
          gradle --no-daemon --max-workers=2 :app:testDebugUnitTest

      - name: Run Android lint
        run: |
          cd android-v22
          gradle --no-daemon --max-workers=2 :app:lintDebug

      - name: Build hardened TANU APK
        run: |
          cd android-v22
          gradle --no-daemon --max-workers=2 :app:assembleDebug

      - name: Verify hardened APK contents
        run: |
          cd android-v22
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk TANU-Personal-v2.2.1-Hardened.apk
          unzip -l TANU-Personal-v2.2.1-Hardened.apk | grep -q 'assets/models/ggml-tiny-q5_1.bin'
          unzip -l TANU-Personal-v2.2.1-Hardened.apk | grep -q 'assets/models/Qwen3-0.6B-Q4_K_M.gguf'
          unzip -l TANU-Personal-v2.2.1-Hardened.apk | grep -q 'lib/arm64-v8a/libtanu-whisper.so'
          unzip -l TANU-Personal-v2.2.1-Hardened.apk | grep -q 'lib/arm64-v8a/libai-chat.so'
          test "$(unzip -Z1 TANU-Personal-v2.2.1-Hardened.apk | grep '^assets/models/' | grep -v '/$' | wc -l)" -eq 2
          ! unzip -Z1 TANU-Personal-v2.2.1-Hardened.apk | grep -q '^lib/x86'
          sha256sum TANU-Personal-v2.2.1-Hardened.apk | tee TANU-Personal-v2.2.1-Hardened.apk.sha256
          ls -lh TANU-Personal-v2.2.1-Hardened.apk

      - name: Upload hardened installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TANU-Personal-v2.2.1-Hardened-Android-Install
          path: |
            android-v22/TANU-Personal-v2.2.1-Hardened.apk
            android-v22/TANU-Personal-v2.2.1-Hardened.apk.sha256
          if-no-files-found: error
          retention-days: 30
