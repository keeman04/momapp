name: Build TANU 1.4 Integrated APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Generate TANU base project
        run: bash ci/generate.sh

      - name: Apply TANU 1.2 Premium foundation
        run: |
          cat ci/premium_gzpart_* > /tmp/premium_patch.gz.b64
          echo "7e66833a4f2282713a89debb62e1fc5979906b78123ef20d05dcb07044577c7c  /tmp/premium_patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/premium_patch.gz.b64 | gzip -d > /tmp/premium_patch.sh
          echo "b9536dccfed464290f671a3bba047d13ea0c2acd4fd1302024cfa22258e13ccb  /tmp/premium_patch.sh" | sha256sum -c -
          bash /tmp/premium_patch.sh

      - name: Apply TANU 1.3 retention and foreground recording
        run: |
          cat ci/tanu13_patch.b64.* > /tmp/tanu13_patch.gz.b64
          echo "6b72bdb72e7a05f00a07f9e51a959af2d88c4a2ad93fb48deef0901f63ceba43  /tmp/tanu13_patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/tanu13_patch.gz.b64 | gzip -d > /tmp/tanu13_apply.sh
          echo "f6d1811546dd68f896b19ba9638c36a322a6b79c78b10bdee02697bdc4bd2027  /tmp/tanu13_apply.sh" | sha256sum -c -
          bash /tmp/tanu13_apply.sh

      - name: Apply TANU 1.3.1 permanent MOM control
        run: |
          echo "693f899b102846d26b1563d82192e517f753c20a7ffe471cff9dcf20b71312b4  ci/tanu131_delete_patch.sh" | sha256sum -c -
          bash ci/tanu131_delete_patch.sh

      - name: Apply TANU 1.4 final UI branding and audio intelligence
        run: |
          cat ci/tanu14_gzpart_* > /tmp/tanu14_patch.gz.b64
          echo "ecdc0930013b50c39e2e2bc15f07e3fa160216fa12d448f8f7b9b8681aa56806  /tmp/tanu14_patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/tanu14_patch.gz.b64 | gzip -d > /tmp/tanu14_apply.sh
          echo "a076df760f0ecb86f4eb8fffbfe013e49b2b139790a1de4cba56060f85773051  /tmp/tanu14_apply.sh" | sha256sum -c -
          bash /tmp/tanu14_apply.sh
          sed -i "s/versionCode [0-9][0-9]*/versionCode 15/; s/versionName '[^']*'/versionName '1.4'/" app/build.gradle

      - name: Validate TANU 1.4 product rules
        run: |
          grep -q 'foregroundServiceType="microphone"' app/src/main/AndroidManifest.xml
          grep -q 'FOREGROUND_SERVICE_MICROPHONE' app/src/main/AndroidManifest.xml
          grep -q 'WAKE_LOCK' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -q 'AudioRecord' app/src/main/java/com/tanu/app/RecordingService.java
          grep -q 'NoiseSuppressor' app/src/main/java/com/tanu/app/RecordingService.java
          grep -q 'AcousticEchoCanceler' app/src/main/java/com/tanu/app/RecordingService.java
          grep -q 'PARTIAL_WAKE_LOCK' app/src/main/java/com/tanu/app/RecordingService.java
          grep -q 'FLAG_KEEP_SCREEN_ON' app/src/main/java/com/tanu/app/MainActivity.java
          grep -q 'Noise & Slang' app/src/main/java/com/tanu/app/MainActivity.java
          grep -q 'Delete this MOM' app/src/main/java/com/tanu/app/MainActivity.java
          grep -q 'tanu_logo_mark' app/src/main/java/com/tanu/app/MainActivity.java
          test -s app/src/main/res/drawable-nodpi/tanu_logo_mark.webp
          test -s app/src/main/res/drawable-nodpi/tanu_app_icon.webp
          ! grep -q 'Current TANU storage' app/src/main/java/com/tanu/app/MainActivity.java

      - name: Fetch offline Whisper engine
        run: |
          git clone --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp.git app/src/main/cpp/whispercpp

      - name: Bundle multilingual Whisper model
        run: |
          curl -L --fail --retry 4 --retry-delay 2 \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin?download=true \
            -o app/src/main/assets/models/ggml-base-q5_1.bin
          test $(stat -c%s app/src/main/assets/models/ggml-base-q5_1.bin) -gt 50000000
          ls -lh app/src/main/assets/models/ggml-base-q5_1.bin

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TANU-1.4-Integrated.apk
          test -s TANU-1.4-Integrated.apk
          unzip -l TANU-1.4-Integrated.apk | grep -q 'ggml-base-q5_1.bin'
          unzip -l TANU-1.4-Integrated.apk | grep -q 'libtanu-whisper.so'
          unzip -l TANU-1.4-Integrated.apk | grep -q 'tanu_logo_mark.webp'
          ls -lh TANU-1.4-Integrated.apk
          sha256sum TANU-1.4-Integrated.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TANU-1.4-Integrated-Android-Install
          path: TANU-1.4-Integrated.apk
          if-no-files-found: error
          retention-days: 30
